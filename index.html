<!DOCTYPE html>
<html class="html_studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shark Studio</title>
    <link rel="stylesheet" href="style.css?v=1.0.11" />
  </head>
  <body>
    <div class="card">
      <nav class="switch_site">
        <a
          href="index.html"
          class="switch_site_btn switch_site_btn_studio switch_site_btn--active"
          >Студия</a
        >
        <span class="site_divider">|</span>
        <a href="typogr.html" class="switch_site_btn switch_site_btn_typogr"
          >Типография</a
        >
      </nav>
      <div class="photo">
        <img src="shark_studio.jpg" alt="Shark studio logo" />
      </div>
      <div class="text_photo">
        <h2>Shark Studio</h2>
      </div>
      <div class="buttons">
        <a
          href="https://vk.ru/22art_house22"
          class="btn btn_studio"
          target="_blank"
          rel="noopener"
        >
          <img
            class="icon_net"
            src="vk-brands-solid-full-white.svg"
            alt="icon vk"
          />
          <span>Страница в ВКонтакте</span></a
        >
        <a
          href="https://t.me/art_house22"
          class="btn btn_studio"
          target="_blank"
          rel="noopener"
        >
          <img
            class="icon_net"
            src="telegram-brands-solid-full-white.svg"
            alt="icon telegram"
          />
          <span>Канал в Telegram</span></a
        >
        <a
          href="https://www.youtube.com/@22shark_studio22/featured"
          class="btn btn_studio"
          target="_blank"
          rel="noopener"
        >
          <img
            class="icon_net"
            src="youtube-brands-solid-full-white.svg"
            alt="icon youtube"
          />
          <span>Канал на YouTube</span></a
        >
      </div>
      <div class="text_footer">
        <p>Милые стикерпаки, открытки, магниты от Крымского автора</p>
      </div>
    </div>
    <footer>
      <p>© 2026 Shark Studio. Все права защищены.</p>
    </footer>
  </body>
</html>
